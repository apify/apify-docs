StylesPath = .github/styles
MinAlertLevel = warning
IgnoredScopes = code, tt, table, tr, td, frontmatter, link, alt, heading

Vocab = Docs

Packages = write-good, Microsoft, https://github.com/apify/vale-rules/releases/download/v1.0.0/ApifyStyleGuide.zip

[formats]
mdx = md

[*.md]
BasedOnStyles = Vale, Apify, ApifyDocs, write-good, Microsoft
# Ignore URLs, HTML/XML tags, lines with =, emails, curly braces, inline code
TokenIgnores = (<\/?[A-Z][^>]*>), ([^\n]+@[^\n]+\.[^\n]), ({[^}]*})

# Disabling rules (NO)
Vale.Spelling = NO
write-good.ThereIs = NO
Microsoft.Dashes = YES
# Sentence case is a documented rule, but Microsoft.Headings ships as a suggestion
# so a default run hides it. Warning makes it visible; error would gate on 446
# pre-existing violations across sources/.
Microsoft.Headings = warning
Microsoft.Avoid = NO
Microsoft.Contractions = NO
Microsoft.Foreign = NO
Microsoft.We = NO
Microsoft.Quotes = NO
Microsoft.Auto = NO
Microsoft.Units = NO
Microsoft.URLFormat = NO
Microsoft.GeneralURL = NO

[{README.md,CONTRIBUTING.md}]
ApifyDocs.H1 = NO

[.claude/**/*.md]
# Ignore all Vale checks in .claude directory (infrastructure docs)
BasedOnStyles =

[standards/**/*.md]
BasedOnStyles =

[.agents/**/*.md]
BasedOnStyles =

[docs-tests/**/*.md]
# Ignore all Vale checks in docs-tests (internal tooling, not published docs).
# BasedOnStyles = clears style-based rules; Microsoft.Dashes is toggled on
# explicitly above, so it must be turned off explicitly here too.
BasedOnStyles =
Microsoft.Dashes = NO
