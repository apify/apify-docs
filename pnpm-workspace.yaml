packages:
  - apify-docs-theme

overrides:
  openapi-to-postmanv2>js-yaml: 5.4.1
  yaml@1: ^2.0.0

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
  # Renovate security update: js-yaml@5.4.1
  - js-yaml@5.4.1

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - "*"
legacyPeerDeps: true

# pnpm v11 enables strictDepBuilds by default and fails the install if a
# dependency's build scripts are neither approved nor explicitly declined.
# These packages ship prebuilt binaries or have non-essential lifecycle
# scripts, so we keep them disabled as on pnpm v10.
allowBuilds:
  "@apify/ui-icons": false
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  core-js: false
  core-js-pure: false
  postman-code-generators: false
  protobufjs: false
