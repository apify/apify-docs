name: Docs UI assertion baseline

# Static checks on the Console-UI assertion baseline in docs-tests/assertions/.
# The job reads files only: no browser, no secrets, no dependency install.
#
# - Format: every assertion follows the rules in docs-tests/scripts/check-baseline.mjs.
#   A violation fails the job.
# - Doc drift: every assertion's source_file / source_quote still resolves.
#   A stale one is reported as a warning and in the job summary, without failing.
#   On pushes to master, stale assertions also go to the `docs-ui-drift` issue.
#
# The browser checks against Console do not run from this repository. This repo
# is public, and signing in to Console staging needs credentials that must not
# be stored here.

on:
    pull_request:
        paths:
            -   'sources/platform/**'    # a doc move or rewrite can make the baseline stale
            -   'docs-tests/**'
            -   '.github/workflows/docs-ui-tests.yaml'
    push:
        branches:
            -   master
        paths:
            -   'sources/platform/**'
            -   'docs-tests/**'
            -   '.github/workflows/docs-ui-tests.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

defaults:
    run:
        working-directory: docs-tests

jobs:
    baseline:
        name: Check assertion baseline
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
                with:
                    persist-credentials: false

            -   name: Use Node.js 24
                uses: actions/setup-node@v7.1.0
                with:
                    node-version: 24

            -   name: Test the checker
                run: node --test scripts/

            -   name: Check the assertion baseline
                run: node scripts/check-baseline.mjs

    # After a merge, report stale assertions to the docs maintainers. Never runs
    # on pull requests, so a fork cannot reach the issues-write token. To avoid a
    # new issue per push, it comments on the open `docs-ui-drift` issue if there
    # is one. The body holds only what is already public in this repository.
    report-drift:
        name: Report doc drift
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: baseline
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            -   uses: actions/checkout@v7.0.1
                with:
                    persist-credentials: false

            -   name: Use Node.js 24
                uses: actions/setup-node@v7.1.0
                with:
                    node-version: 24

            -   name: Check for stale assertions
                id: strict
                continue-on-error: true
                env:
                    DRIFT_REPORT: ${{ runner.temp }}/drift.md
                run: |
                    set -euo pipefail
                    : > "$DRIFT_REPORT"
                    GITHUB_STEP_SUMMARY="$DRIFT_REPORT" node scripts/check-baseline.mjs --strict

            -   name: Comment on or open the drift issue
                if: steps.strict.outcome == 'failure'
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                    DRIFT_REPORT: ${{ runner.temp }}/drift.md
                run: |
                    set -euo pipefail
                    BODY="$(mktemp)"
                    {
                      echo "The assertion baseline in \`docs-tests/assertions/\` no longer matches the docs on \`master\` at ${GITHUB_SHA}."
                      echo ""
                      cat "$DRIFT_REPORT"
                      echo ""
                      echo "Re-extract the affected pages or update the assertions by hand, see \`docs-tests/README.md\`. Filed by the [workflow run](${RUN_URL})."
                    } > "$BODY"

                    gh label create docs-ui-drift --repo "$REPO" \
                      --color BFD4F2 --description "Automated Console UI drift report" --force || true

                    EXISTING=$(gh issue list --repo "$REPO" --state open --label docs-ui-drift \
                      --limit 1 --json number --jq '.[0].number // empty')

                    if [[ -n "$EXISTING" ]]; then
                      gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY"
                    else
                      gh issue create --repo "$REPO" \
                        --title "Docs UI assertion baseline is stale" \
                        --body-file "$BODY" \
                        --label docs-ui-drift --label t-docs
                    fi
