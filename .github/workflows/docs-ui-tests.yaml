name: Docs UI drift tests

# Verifies Console-UI claims extracted from the platform docs against Console
# staging with Playwright. Assertions are a committed, human-reviewed baseline
# (docs-tests/assertions/); this job only evaluates them — extraction runs
# locally, never in CI.
#
# Credentials come from repo Actions secrets (CONSOLE_STAGING_*). The seeded
# staging user is low-privilege and has no 2FA; login is scripted fresh each run
# and the session is held in memory (no auth file).
#
# doc-integrity: PR-time, advisory, no browser or secrets.
# ui-drift: weekly + manual, files a drift issue on failure.

on:
    schedule:
        -   cron: '0 6 * * 1'   # Every Monday 06:00 UTC
    workflow_dispatch:           # Manual on-demand run
    pull_request:
        paths:
            -   'sources/platform/**'    # a doc move/rewrite can stale the baseline
            -   'docs-tests/**'          # harness or baseline changes
            -   '.github/workflows/docs-ui-tests.yaml'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        working-directory: docs-tests

jobs:
    # Advisory: `continue-on-error` keeps findings from blocking the merge.
    doc-integrity:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Use Node.js 24
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24

            -   name: Install pnpm and docs-tests dependencies
                uses: apify/actions/pnpm-install@v1.4.0
                with:
                    working-directory: docs-tests

            # No `playwright install`: the integrity project never requests a
            # browser fixture. `--retries=0` because CI=true enables a retry,
            # which can't change a static result and would list findings twice.
            -   name: Check doc back-references resolve
                id: integrity
                continue-on-error: true
                run: pnpm test:integrity --retries=0

            # On failure, run the same check on the base commit so the summary
            # can separate findings this PR introduced from ones already there.
            -   name: Check out the base commit
                if: steps.integrity.outcome == 'failure'
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    ref: ${{ github.event.pull_request.base.sha }}
                    path: base

            -   name: Install docs-tests dependencies on the base commit
                if: steps.integrity.outcome == 'failure'
                uses: apify/actions/pnpm-install@v1.4.0
                with:
                    working-directory: base/docs-tests

            -   name: Check doc back-references on the base commit
                if: steps.integrity.outcome == 'failure'
                continue-on-error: true
                working-directory: base/docs-tests
                run: pnpm test:integrity --retries=0

            -   name: Summarize
                if: steps.integrity.outcome == 'failure'
                env:
                    BASE_REF: ${{ github.event.pull_request.base.ref }}
                run: |
                    set -euo pipefail
                    REPORT=output/issues.json
                    BASE_REPORT=../base/docs-tests/output/issues.json

                    {
                      echo "### Docs-tests: unresolved doc back-references"
                      echo ""
                      echo "This is **informative only** and does not block the merge."
                      echo ""
                    } >> "$GITHUB_STEP_SUMMARY"

                    if [[ ! -f "$REPORT" ]]; then
                      echo "The check failed before producing a report — see the job logs." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi

                    table() {
                      echo "| Assertion | Doc source |"
                      echo "| --- | --- |"
                      jq -r '.[] | "| `\(.id)` | `\(.source_file):\(.source_line)` |"' <<< "$1"
                      echo ""
                    }

                    if [[ -f "$BASE_REPORT" ]]; then
                      BASE_IDS=$(jq -c '[.issues[].id]' "$BASE_REPORT")
                      NEW=$(jq -c --argjson base "$BASE_IDS" '[.issues[] | select(.id | IN($base[]) | not)]' "$REPORT")
                      OLD=$(jq -c --argjson base "$BASE_IDS" '[.issues[] | select(.id | IN($base[]))]' "$REPORT")
                      NEW_HEADING="Resolve on \`${BASE_REF}\` but not on this branch:"
                    else
                      NEW=$(jq -c '.issues' "$REPORT")
                      OLD='[]'
                      NEW_HEADING="Don't resolve on this branch (comparison with \`${BASE_REF}\` unavailable):"
                    fi

                    # Annotations show in the checks view and inline in the diff.
                    # GitHub caps them at 10 per step, so the table stays the full list.
                    jq -r '.[] | "::warning file=\(.source_file),line=\(.source_line),title=Unresolved doc back-reference::docs-tests assertion \(.id) no longer resolves in \(.source_file)."' <<< "$NEW"

                    {
                      if [[ "$(jq length <<< "$NEW")" -gt 0 ]]; then
                        echo "$NEW_HEADING"
                        echo ""
                        table "$NEW"
                        echo "Fix by repointing \`docs-tests/pages.json\` and the affected \`assertions/*.json\` at the new path, or re-extracting the page. Left unfixed, the weekly drift check goes red and files an issue."
                        echo ""
                      fi
                      if [[ "$(jq length <<< "$OLD")" -gt 0 ]]; then
                        echo "Already unresolved on \`${BASE_REF}\`, not caused by this PR:"
                        echo ""
                        table "$OLD"
                      fi
                    } >> "$GITHUB_STEP_SUMMARY"

    ui-drift:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write   # the failure step files a drift issue for maintainers
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Use Node.js 24
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24

            -   name: Install pnpm and docs-tests dependencies
                # Shared Apify action: sets up pnpm (version from
                # docs-tests/package.json "packageManager"), caches the pnpm
                # store, and installs with --frozen-lockfile. working-directory
                # is docs-tests because it's a standalone project with its own
                # lockfile, not part of the repo-root pnpm workspace.
                uses: apify/actions/pnpm-install@v1.4.0
                with:
                    working-directory: docs-tests

            -   name: Install Playwright browser
                run: pnpm exec playwright install --with-deps chromium

            -   name: Run docs UI drift tests
                env:
                    CI: 'true'
                    CONSOLE_STAGING_URL: ${{ secrets.CONSOLE_STAGING_URL }}
                    CONSOLE_STAGING_USER_EMAIL: ${{ secrets.CONSOLE_STAGING_USER_EMAIL }}
                    CONSOLE_STAGING_USER_PASSWORD: ${{ secrets.CONSOLE_STAGING_USER_PASSWORD }}
                run: pnpm test

            -   name: Upload Playwright report
                if: always()
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
                with:
                    name: playwright-report
                    path: docs-tests/playwright-report/
                    retention-days: 14

            -   name: Upload drift report (issues.json)
                if: always()
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
                with:
                    name: drift-report
                    path: docs-tests/output/
                    retention-days: 14

            # On any failure (drift found, or the job broke before tests ran),
            # open a GitHub issue for the docs maintainers. To avoid a new issue
            # every week, reuse the open `docs-ui-drift` issue if one exists and
            # comment on it instead. The body is kept public-safe: it links to
            # the run (where the report/artifacts live) and lists only assertion
            # IDs + their doc source — never the staging URL or credentials.
            -   name: File a drift issue for maintainers
                if: failure()
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                run: |
                    set -euo pipefail
                    REPORT=output/issues.json
                    BODY="$(mktemp)"

                    if [[ -f "$REPORT" ]]; then
                      PASSED=$(jq -r '.summary.passed' "$REPORT")
                      FAILED=$(jq -r '.summary.failed' "$REPORT")
                      SKIPPED=$(jq -r '.summary.skipped' "$REPORT")
                      TOTAL=$(jq -r '.summary.total' "$REPORT")
                      {
                        echo "The scheduled docs-UI drift check found **${FAILED} failing assertion(s)** (${PASSED}/${TOTAL} passed, ${SKIPPED} skipped)."
                        echo ""
                        echo "Filed automatically by the \`Docs UI drift tests\` workflow. Logs, the Playwright report, and \`issues.json\` are on the [workflow run](${RUN_URL})."
                        echo ""
                        echo "### Failing assertions"
                        echo ""
                        echo "| Assertion | Kind | Target | Doc source |"
                        echo "| --- | --- | --- | --- |"
                        jq -r '.issues[] | "| `\(.id)` | \(.kind) | \(.target) | `\(.source_file):\(.source_line)` |"' "$REPORT"
                        echo ""
                        echo "Each failure is either genuine doc drift (the Console changed, the docs did not) or a harness limitation (selector needs a click first, or a logged-out/session-gated page). Triage against the Playwright report."
                      } > "$BODY"
                    else
                      {
                        echo "The \`Docs UI drift tests\` workflow failed before producing a drift report (likely a setup or login error)."
                        echo ""
                        echo "See the [workflow run](${RUN_URL}) for logs."
                      } > "$BODY"
                    fi

                    # Ensure the dedup label exists (upsert), then reuse an open
                    # issue if present, otherwise create a new one. No assignee;
                    # labels are docs-ui-drift (dedup marker) + t-docs.
                    gh label create docs-ui-drift --repo "$REPO" \
                      --color BFD4F2 --description "Automated Console UI drift report" --force || true

                    EXISTING=$(gh issue list --repo "$REPO" --state open --label docs-ui-drift \
                      --limit 1 --json number --jq '.[0].number // empty')

                    if [[ -n "$EXISTING" ]]; then
                      gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY"
                      echo "Commented on existing drift issue #${EXISTING}"
                    else
                      gh issue create --repo "$REPO" \
                        --title "Docs UI drift detected by scheduled tests" \
                        --body-file "$BODY" \
                        --label docs-ui-drift --label t-docs
                    fi
