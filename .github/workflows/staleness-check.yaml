name: Docs staleness check

on:
    schedule:
        -   cron: '0 6 1 * *'  # Run monthly
    workflow_dispatch:  # Allow manual triggering

permissions:
    contents: read
    issues: write

jobs:
    staleness-check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
                with:
                    fetch-depth: 0  # The check reads commit history of each page

            -   name: Use Node.js 24
                uses: actions/setup-node@v7.1.0
                with:
                    node-version: 24
                    check-latest: true

            -   name: Find stale pages
                run: node scripts/checkStaleness.mjs > staleness-report.md

            -   name: Open report issue
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    gh issue create \
                        --title "Stale platform docs - $(date -u +'%B %Y')" \
                        --body-file staleness-report.md \
                        --label t-docs \
                        --assignee szaganek
