name: Docs PR Previews

# No secrets here, pull request branches cannot read them; `pr-previews-trigger.yaml` starts the build from master.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  cancel-in-progress: false
  group: 'docs-pr-previews-${{ github.event.pull_request.number }}'

jobs:
  record-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Record the pull request
        run: |
          mkdir preview
          echo "$PR_NUMBER" > preview/pr-number
          echo "$PREVIEW_ACTION" > preview/action
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ACTION: ${{ github.event.action == 'closed' && 'delete' || 'create' }}

      - name: Upload the record
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preview
          path: preview/
          retention-days: 1
