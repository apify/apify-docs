name: Test Academy

on:
    schedule:
        - cron: "0 3 1 * *"  # at 3am UTC on 1st day of month
    workflow_dispatch:  # allows running this workflow manually from the Actions tab

jobs:
    test-exercises:
        name: Test Academy Exercises
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24

            -   name: Setup Python
                uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

            -   uses: apify/actions/pnpm-install@v1.3.1

            -   name: Test
                run: pnpm test:academy
