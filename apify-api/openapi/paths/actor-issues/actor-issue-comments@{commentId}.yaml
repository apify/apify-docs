put:
  tags:
    - Actor issues
  summary: Update Actor issue comment
  description: |
    Updates the text of an Actor issue comment. Files attached to the comment are
    kept. The response is the updated comment.

    To change the issue description, use the [Update Actor issue](/api/v2/actor-issue-put)
    endpoint instead.
  operationId: actorIssueComment_put
  parameters:
    - $ref: "../../components/parameters/actorIssueParameters.yaml#/commentId"
  requestBody:
    description: ""
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/actor-issues/ActorIssueCommentRequest.yaml
    required: true
  responses:
    "200":
      description: ""
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/actor-issues/ActorIssueCommentResponse.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "413":
      $ref: ../../components/responses/PayloadTooLarge.yaml
    "415":
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
