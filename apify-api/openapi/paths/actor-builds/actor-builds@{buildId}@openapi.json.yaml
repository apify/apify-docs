get:
  tags:
    - Actor builds
  summary: Get OpenAPI definition of Actor build
  description: |
    Get the OpenAPI definition for Actor builds. Two similar endpoints are available:

    - [Get OpenAPI definition of Actor build](/api/v2/actor-openapi-json-get) (`/v2/actors/{actorId}/builds/{buildId}/openapi.json`): Requires both `actorId` and `buildId`. Use `default` as the `buildId` to get the OpenAPI schema for the default Actor build.
    - [Get OpenAPI definition of Actor build](/api/v2/actor-build-openapi-json-get) (`/v2/actor-builds/{buildId}/openapi.json`): Requires only `buildId`.

    Get the OpenAPI definition for a specific Actor build.
    Authentication is based on the build's unique ID. No authentication token is required.

    :::note

    You can also use the [Get OpenAPI definition of Actor build](/api/v2/actor-openapi-json-get) endpoint (`/v2/actors/{actorId}/builds/{buildId}/openapi.json`) to get the OpenAPI definition for a build.

    :::
  operationId: actorBuild_openapi_json_get
  security: []
  parameters:
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/buildIdWithDefault"
  responses:
    "200":
      description: The OpenAPI specification document for the Actor build.
      headers: {}
      content:
        application/json:
          schema:
            type: object
            description: A standard OpenAPI 3.x JSON document.
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  x-js-parent: BuildClient
  x-js-name: getOpenApiDefinition
  x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/BuildClient#getOpenApiDefinition
  x-py-parent: BuildClient
  x-py-name: get_open_api_definition
  x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/BuildClient#get_open_api_definition
