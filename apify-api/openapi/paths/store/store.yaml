get:
  tags:
    - Store
  summary: Get list of Actors in Store
  description: |
    Gets the list of public Actors in Apify Store. You can use `search`
    parameter to search Actors by string in title, name, description, username
    and readme.
    If you need detailed info about a specific Actor, use the [Get Actor](/api/v2/actor-get) endpoint.

    Without `search`, the endpoint supports pagination using the `limit` and
    `offset` parameters. It will not return more than 1,000 records per page.

    With `search`, results are ranked by relevance and returned as a single
    page of at most 100 records. `offset` is ignored and there is no second
    page. `total` and `count` equal the number of returned items. To narrow
    the results, use `category`, `username` or `pricingModel`.
  operationId: store_get
  parameters:
    - $ref: "../../components/parameters/paginationParameters.yaml#/storeLimit"
    - $ref: "../../components/parameters/paginationParameters.yaml#/storeOffset"
    - name: search
      in: query
      description: |
        String to search by. Results are ranked by relevance and returned as a
        single page of at most 100 items.
      style: form
      explode: true
      schema:
        type: string
        example: web scraper
    - name: sortBy
      in: query
      description: |
        Deprecated and ignored. The value is accepted for backward
        compatibility but has no effect. Results are ordered by relevance when
        `search` is used, and by Store position otherwise. Sort the results
        on the client if you need a different order.
      deprecated: true
      style: form
      explode: true
      schema:
        type: string
        example: "'popularity'"
    - name: category
      in: query
      description: |
        Filters the results by category. Accepts one or more category IDs,
        separated by commas and case-insensitive. An Actor must match all of
        the listed categories. See the
        [list of category IDs](https://github.com/apify/apify-shared-js/blob/master/packages/actor-categories/src/actor_categories.ts).
        Legacy keys such as `social_media` are still accepted. An unknown
        category returns a `400` error.
      style: form
      explode: true
      schema:
        type: string
        example: AI_AND_ML
    - name: username
      in: query
      description: Filters the results by the specified username.
      style: form
      explode: true
      schema:
        type: string
        example: "'apify'"
    - name: pricingModel
      in: query
      description: |
        Only return Actors with the specified pricing model.
      style: form
      explode: true
      schema:
        type: string
        enum:
          - FREE
          - PRICE_PER_DATASET_ITEM
          - PAY_PER_EVENT
        example: FREE
    - name: allowsAgenticUsers
      in: query
      description: |
        If true, only return Actors that allow agentic users. If false, only
        return Actors that do not allow agentic users.
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    - name: responseFormat
      in: query
      description: |
        Controls the shape of the response. Use `full` (default) for the
        complete response including image URLs and all fields. Use `agent`
        for a reduced field set optimized for LLM consumers, which only
        includes `id`, `title`, `name`, `username`, `description`, `notice`,
        `badge`, `categories`, and minimal `stats`.
      style: form
      explode: true
      schema:
        type: string
        enum:
          - full
          - agent
        default: full
        example: agent
    - name: includeUnrunnableActors
      in: query
      description: |
        By default, search results exclude Actors that are not safe to run
        automatically (e.g. Actors from developers who haven't passed KYC, or
        full-permission Actors without a large user base). Set to `true` to
        bypass this safety filtering and include all Actors in the results.
      style: form
      explode: true
      schema:
        type: boolean
        default: false
        example: true
    - name: includeInputSchema
      in: query
      description: |
        If `true`, each Actor in the results includes an `inputSchema` field with a compact version of the input
        schema of its default build (property types and required properties only). With this parameter, `limit`
        defaults to and can't exceed `10`.
      style: form
      explode: true
      schema:
        type: boolean
        default: false
        example: true
  responses:
    "200":
      description: ""
      headers:
        $ref: ../../components/headers/ApifyPaginationHeaders.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/store/ListOfStoreActorsResponse.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/store/store-actors-collection/get-list-of-actors-in-store
    - https://docs.apify.com/api/v2#/reference/store/get-list-of-actors-in-store
    - https://docs.apify.com/api/v2#tag/StoreStore-Actors-collection/operation/store_get
