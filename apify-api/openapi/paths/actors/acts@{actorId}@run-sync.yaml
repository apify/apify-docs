        The Actor Standby deployment to start the run in. Only valid for runs that Actor Standby starts (with the
        `STANDBY` origin), any other run rejects it. Multi-tenant Standby Actors require one of the `MULTI_TENANT_*`
        values, where the free-user and paying-user pools are only available for pay-per-event Actors. User-hosted
        Standby Actors only accept `SINGLE_TENANT`, which is also their default.
      style: form
      explode: true
      schema:
        type: string
        enum:
