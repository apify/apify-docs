post:
  tags:
    - Actors/Actor runs
  summary: Run Actor synchronously and get key-value store record
  description: |
    Runs a specific Actor and returns a key-value store record.

    The POST payload including its `Content-Type` header is passed as `INPUT` to
    the Actor (usually <code>application/json</code>).

    The response contains the record stored under the `OUTPUT` key in the run's
    default key-value store. This is a legacy approach that has been replaced by
    the Actor [output object](https://docs.apify.com/platform/actors/development/actor-definition/output-schema#output-object-definition);
    Actors aren't required to store a record under this key, so the response may
    not contain any data. Use the `outputRecordKey` query parameter to return a
    different record.

    The Actor is started with the default options; you can override them using
    various URL query parameters.
    If the Actor run exceeds 300<!-- MAX_ACTOR_JOB_SYNC_WAIT_SECS --> seconds,
    the HTTP response will have status 408 (Request Timeout).

    Beware that it might be impossible to maintain an idle HTTP connection for a
    long period of time, due to client timeout or network conditions. Make sure your HTTP client is
    configured to have a long enough connection timeout.
    If the connection breaks, you will not receive any information about the run
    and its status.

    To run the Actor asynchronously, use the [Run Actor](/api/v2/actors-runs-post) API endpoint instead.
  operationId: actor_runSync_post
  parameters:
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/actorId"
    - $ref: "../../components/parameters/runSyncParameters.yaml#/outputRecordKey"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/timeout"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/memory"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxItems"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxTotalChargeUsd"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/restartOnError"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/build"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/webhooks"
    - name: forcePermissionLevel
      in: query
      description: |
        Overrides the Actor's permission level for this specific run. Use to test restricted permissions
        before deploying changes to your Actor or to temporarily elevate or restrict access. If you don't specify this
        parameter, the Actor uses its configured default permission level. For more information on permissions, see the
        [documentation](https://docs.apify.com/platform/actors/development/permissions).
      style: form
      explode: true
      schema:
        type: string
        enum:
          - LIMITED_PERMISSIONS
          - FULL_PERMISSIONS
        example: LIMITED_PERMISSIONS
    - name: standbyDeployment
      in: query
      description: |
        The Actor Standby deployment to start the run in. Only valid for runs that Actor Standby starts (with the
        `STANDBY` origin), any other run rejects it. Multi-tenant Standby Actors require one of the `MULTI_TENANT_*`
        values, where the free-user and paying-user pools are only available for pay-per-event Actors. User-hosted
        Standby Actors only accept `SINGLE_TENANT`, which is also their default.
      style: form
      explode: true
      schema:
        type: string
        enum:
          - SINGLE_TENANT
          - MULTI_TENANT_FREE_USERS
          - MULTI_TENANT_PAYING_USERS
          - MULTI_TENANT_OWNER_PAID
        example: SINGLE_TENANT
  requestBody:
    description: ""
    content:
      application/json:
        schema:
          type: object
        example:
          foo: bar
      "*/*":
        schema: {}
    required: true
  responses:
    "201":
      description: ""
      headers: {}
      content:
        application/json:
          schema:
            type: object
          example:
            bar: foo
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "402":
      $ref: ../../components/responses/PaymentRequired.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "408":
      $ref: ../../components/responses/Timeout.yaml
    "415":
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/actors/run-actor-synchronously/with-input
    - https://docs.apify.com/api/v2#/reference/actors/with-input
    - https://docs.apify.com/api/v2#tag/ActorsRun-actor-synchronously/operation/act_runSync_post
get:
  tags:
    - Actors/Actor runs
  summary: Run Actor synchronously and get key-value store record (GET)
  description: |
    Runs a specific Actor and returns a key-value store record. The response contains the
    record stored under the `OUTPUT` key in the run's default key-value store.
    This is a legacy approach that has been replaced by the Actor
    [output object](https://docs.apify.com/platform/actors/development/actor-definition/output-schema#output-object-definition);
    the record may not exist, in which case the response contains no data. Use the
    `outputRecordKey` query parameter to return a different record.
    The run must finish in 300<!-- MAX_ACTOR_JOB_SYNC_WAIT_SECS --> seconds
    otherwise the API endpoint returns a timeout error.
    The Actor is not passed any input.

    Beware that it might be impossible to maintain an idle HTTP connection for a
    long period of time,
    due to client timeout or network conditions. Make sure your HTTP client is
    configured to have a long enough connection timeout.
    If the connection breaks, you will not receive any information about the run
    and its status.

    To run the Actor asynchronously, use the [Run Actor](/api/v2/actors-runs-post) API endpoint instead.
