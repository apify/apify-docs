get:
  tags:
    - Actors/Actor runs
  summary: Get list of Actor's runs
  description: |
    Gets the list of runs of a specific Actor. The response is a list of
    objects, where each object contains basic information about a single Actor run.

    The endpoint supports pagination using the `limit` and `offset` parameters
    and it will not return more than 1000 array elements.

    By default, the records are sorted by the `startedAt` field in ascending
    order, therefore you can use pagination to incrementally fetch all records while
    new ones are still being created. To sort the records in descending order, use
    `desc=1` parameter. You can also filter runs by status ([available
    statuses](https://docs.apify.com/platform/actors/running/runs-and-builds#lifecycle)).
  operationId: actors_runs_get
  parameters:
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/actorId"
    - $ref: "../../components/parameters/paginationParameters.yaml#/offset"
    - $ref: "../../components/parameters/paginationParameters.yaml#/limit"
    - $ref: "../../components/parameters/paginationParameters.yaml#/descStartedAt"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/status"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/startedAfter"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/startedBefore"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/deployment"
  responses:
    "200":
      description: ""
      headers:
        $ref: ../../components/headers/ApifyPaginationHeaders.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/actor-runs/ListOfRunsResponse.yaml
          examples:
            example:
              $ref: ../../components/examples/ListOfRunsResponseExample.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/actors/run-collection/get-list-of-runs
    - https://docs.apify.com/api/v2#/reference/actors/get-list-of-runs
    - https://docs.apify.com/api/v2#tag/ActorsRun-collection/operation/act_runs_get
  x-js-parent: RunCollectionClient
  x-js-name: list
  x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/RunCollectionClient#list
  x-py-parent: RunCollectionClientAsync
  x-py-name: list
  x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/RunCollectionClientAsync#list
post:
  tags:
    - Actors/Actor runs
  summary: Run Actor
  description: |
    Runs an Actor and immediately returns without waiting for the run to finish.

    The POST payload including its `Content-Type` header is passed as `INPUT` to
    the Actor (usually `application/json`).

    The Actor is started with the default options; you can override them using
    various URL query parameters.

    The response is the Run object as returned by the [Get Actor run](/api/v2/actor-run-get) API
    endpoint.

    If you want to wait for the run to finish and receive the actual output of
    the Actor as the response, please use the [Run Actor synchronously and get key-value store record](/api/v2/actor-run-sync-post)
    or [Run Actor synchronously and get dataset items](/api/v2/actor-run-sync-get-dataset-items-post)
    endpoint instead.

    To fetch the Actor run results that are typically stored in the default
    dataset, you'll need to pass the ID received in the `defaultDatasetId` field
    received in the response JSON to the [Get dataset items](/api/v2/dataset-items-get)
    API endpoint.
  operationId: actors_runs_post
  parameters:
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/actorId"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/timeout"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/memory"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxItems"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxTotalChargeUsd"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/restartOnError"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/build"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/waitForFinishRun"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/webhooks"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/forcePermissionLevel"
  requestBody:
    description: ""
    content:
      application/json:
        schema:
          type: object
        example:
          foo: bar
      "*/*":
        schema: {}
    required: true
  responses:
    "201":
      description: ""
      headers:
        Location:
          content:
            text/plain:
              schema:
                type: string
              example: >-
                https://api.apify.com/v2/actors/zdc3Pyhyz3m8vjDeM/runs/HG7ML7M8z78YcAPEB
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/actor-runs/RunResponse.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "402":
      $ref: ../../components/responses/PaymentRequired.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "408":
      $ref: ../../components/responses/Timeout.yaml
    "413":
      $ref: ../../components/responses/PayloadTooLarge.yaml
    "415":
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/actors/run-collection/run-actor
    - https://docs.apify.com/api/v2#/reference/actors/run-actor
    - https://docs.apify.com/api/v2#tag/ActorsRun-collection/operation/act_runs_post
  x-js-parent: ActorClient
  x-js-name: start
  x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ActorClient#start
  x-py-parent: ActorClientAsync
  x-py-name: call
  x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ActorClientAsync#call
