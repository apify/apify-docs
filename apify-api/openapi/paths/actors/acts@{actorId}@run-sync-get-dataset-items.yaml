post:
  tags:
    - Actors/Actor runs
  summary: Run Actor synchronously and get dataset items
  description: |
    Runs a specific Actor and returns its dataset items.

    The POST payload including its `Content-Type` header is passed as `INPUT` to
    the Actor (usually `application/json`).
    The HTTP response contains the Actors dataset items, while the format of
    items depends on specifying dataset items' `format` parameter.

    You can send all the same options in parameters as the [Get dataset items](/api/v2/dataset-items-get) API endpoint.

    The Actor is started with the default options; you can override them using
    URL query parameters.
    If the Actor run exceeds 300<!-- MAX_ACTOR_JOB_SYNC_WAIT_SECS --> seconds,
    the HTTP response will return the 408 status code (Request Timeout).

    Beware that it might be impossible to maintain an idle HTTP connection for a
    long period of time,
    due to client timeout or network conditions. Make sure your HTTP client is
    configured to have a long enough connection timeout.
    If the connection breaks, you will not receive any information about the run
    and its status.

    To run the Actor asynchronously, use the [Run Actor](/api/v2/actors-runs-post) API endpoint instead.
  operationId: actor_runSyncGetDatasetItems_post
  parameters:
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/actorId"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/timeout"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/memory"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxItems"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxTotalChargeUsd"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/restartOnError"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/build"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/webhooks"
    - name: forcePermissionLevel
      in: query
      description: |
        Overrides the Actor's permission level for this specific run. Use to test restricted permissions
        before deploying changes to your Actor or to temporarily elevate or restrict access. If you don't specify this
        parameter, the Actor uses its configured default permission level. For more information on permissions, see the
        [documentation](https://docs.apify.com/platform/actors/development/permissions).
      style: form
      explode: true
      schema:
        type: string
        enum:
          - LIMITED_PERMISSIONS
          - FULL_PERMISSIONS
        example: LIMITED_PERMISSIONS
    - name: standbyDeployment
      in: query
      description: |
        The Actor Standby deployment to start the run in. Only valid for runs that Actor Standby starts (with the
        `STANDBY` origin), any other run rejects it. Multi-tenant Standby Actors require one of the `MULTI_TENANT_*`
        values, where the free-user and paying-user pools are only available for pay-per-event Actors. User-hosted
        Standby Actors only accept `SINGLE_TENANT`, which is also their default.
      style: form
      explode: true
      schema:
        type: string
        enum:
          - SINGLE_TENANT
          - MULTI_TENANT_FREE_USERS
          - MULTI_TENANT_PAYING_USERS
          - MULTI_TENANT_OWNER_PAID
        example: SINGLE_TENANT
    - $ref: "../../components/parameters/datasetParameters.yaml#/format"
    - $ref: "../../components/parameters/datasetParameters.yaml#/clean"
    - $ref: "../../components/parameters/paginationParameters.yaml#/offset"
    - $ref: "../../components/parameters/datasetParameters.yaml#/limit"
    - $ref: "../../components/parameters/datasetParameters.yaml#/fields"
    - $ref: "../../components/parameters/datasetParameters.yaml#/outputFields"
    - $ref: "../../components/parameters/datasetParameters.yaml#/omit"
    - $ref: "../../components/parameters/datasetParameters.yaml#/unwind"
    - $ref: "../../components/parameters/datasetParameters.yaml#/flatten"
    - $ref: "../../components/parameters/datasetParameters.yaml#/descDataset"
    - $ref: "../../components/parameters/datasetParameters.yaml#/attachment"
    - $ref: "../../components/parameters/datasetParameters.yaml#/delimiter"
    - $ref: "../../components/parameters/datasetParameters.yaml#/bom"
    - $ref: "../../components/parameters/datasetParameters.yaml#/xmlRoot"
    - $ref: "../../components/parameters/datasetParameters.yaml#/xmlRow"
    - $ref: "../../components/parameters/datasetParameters.yaml#/skipHeaderRow"
    - $ref: "../../components/parameters/datasetParameters.yaml#/skipHidden"
    - $ref: "../../components/parameters/datasetParameters.yaml#/skipEmpty"
    - $ref: "../../components/parameters/datasetParameters.yaml#/simplified"
    - $ref: "../../components/parameters/datasetParameters.yaml#/view"
    - $ref: "../../components/parameters/datasetParameters.yaml#/skipFailedPages"
    - $ref: "../../components/parameters/datasetParameters.yaml#/feedTitle"
    - $ref: "../../components/parameters/datasetParameters.yaml#/feedDescription"
  requestBody:
    description: ""
    content:
      application/json:
        schema:
          type: object
        example:
          foo: bar
      "*/*":
        schema: {}
    required: true
  responses:
    "201":
      description: ""
      headers:
        $ref: ../../components/headers/ApifyPaginationHeaders.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
          example:
            - myValue: some value
              myOtherValue: some other value
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "402":
      $ref: ../../components/responses/PaymentRequired.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "404":
      $ref: ../../components/responses/NotFound.yaml
    "408":
      $ref: ../../components/responses/Timeout.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/actors/run-actor-synchronously-and-get-dataset-items/run-actor-synchronously-with-input-and-get-dataset-items
    - https://docs.apify.com/api/v2#/reference/actors/run-actor-synchronously-with-input-and-get-dataset-items
    - https://docs.apify.com/api/v2#tag/ActorsRun-Actor-synchronously-and-get-dataset-items/operation/act_runSyncGetDatasetItems_post
get:
  tags:
    - Actors/Actor runs
  summary: Run Actor synchronously and get dataset items (GET)
  description: |
    Runs a specific Actor and returns its dataset items.
    The run must finish in 300<!-- MAX_ACTOR_JOB_SYNC_WAIT_SECS --> seconds
    otherwise the API endpoint returns a timeout error.
    The Actor is not passed any input.

    It allows to send all possible options in parameters from [Get dataset items](/api/v2/dataset-items-get) API endpoint.

    Beware that it might be impossible to maintain an idle HTTP connection for a
    long period of time,
    due to client timeout or network conditions. Make sure your HTTP client is
    configured to have a long enough connection timeout.
    If the connection breaks, you will not receive any information about the run
    and its status.

    To run the Actor asynchronously, use the [Run Actor](/api/v2/actors-runs-post) API endpoint instead.
  operationId: actor_runSyncGetDatasetItems_get
  parameters:
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/actorId"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/timeout"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/memory"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxItems"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/maxTotalChargeUsd"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/restartOnError"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/build"
    - $ref: "../../components/parameters/runAndBuildParameters.yaml#/webhooks"
    - name: forcePermissionLevel
      in: query
      description: |
        Overrides the Actor's permission level for this specific run. Use to test restricted permissions
        before deploying changes to your Actor or to temporarily elevate or restrict access. If you don't specify this
        parameter, the Actor uses its configured default permission level. For more information on permissions, see the
