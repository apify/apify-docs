get:
  tags:
    - Actors
  summary: Get list of Actors
  description: |
    Gets the list of all Actors that the user created or used. The response is a
    list of objects, where each object contains a basic information about a single Actor.

    To only get Actors created by the user, add the `my=1` query parameter.

    The endpoint supports pagination using the `limit` and `offset` parameters
    and it will not return more than 1000 records.

    By default, the records are sorted by the `createdAt` field in ascending
    order, therefore you can use pagination to incrementally fetch all Actors while new
    ones are still being created. To sort the records in descending order, use the `desc=1` parameter.

    You can also sort by your last run by using the `sortBy=stats.lastRunStartedAt` query parameter.
    In this case, descending order means the most recently run Actor appears first.

  operationId: actors_get
  parameters:
    - name: my
      in: query
      description: |
        If `true` or `1` then the returned list only contains Actors owned by the user. The default value is `false`.
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    - $ref: "../../components/parameters/paginationParameters.yaml#/offset"
    - $ref: "../../components/parameters/paginationParameters.yaml#/limit"
    - $ref: "../../components/parameters/paginationParameters.yaml#/descCreatedAt"
    - name: sortBy
      in: query
      description: |
        Field to sort the records by. The default is `createdAt`. You can also use `stats.lastRunStartedAt` to sort
        by the most recently ran Actors.
      schema:
        type: string
        enum: [createdAt, stats.lastRunStartedAt]
        example: createdAt
  responses:
    "200":
      description: ""
      headers: {}
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/actors/ListOfActorsResponse.yaml
          example:
            data:
              total: 2
              count: 2
              offset: 0
              limit: 1000
              desc: false
              items:
                - id: br9CKmk457
                  createdAt: "2019-10-29T07:34:24.202Z"
                  modifiedAt: "2019-10-30T07:34:24.202Z"
                  name: MyAct
                  username: janedoe
                - id: ksiEKo23pz
                  createdAt: "2019-11-30T07:34:24.202Z"
                  modifiedAt: "2019-12-12T07:34:24.202Z"
                  name: MySecondAct
                  username: janedoe
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/actors/actor-collection/get-list-of-actors
    - https://docs.apify.com/api/v2#/reference/actors/get-list-of-actors
    - https://docs.apify.com/api/v2#tag/ActorsActor-collection/operation/acts_get
  x-js-parent: ActorCollectionClient
  x-js-name: list
  x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ActorCollectionClient#list
  x-py-parent: ActorCollectionClientAsync
  x-py-name: list
  x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ActorCollectionClientAsync#list
post:
  tags:
    - Actors
  summary: Create Actor
  description: |
    Creates an Actor with the settings specified in an `Actor` object passed as
    JSON in the POST payload.

    Returns the created `Actor` object.

    In the HTTP request, set the `Content-Type` header to `application/json`.

    ### Define a source code version

    An Actor must specify at least one version of the source code.
    For details, see [Actor versions](/api/v2/actors-actor-versions).

    ### Publish an Actor

    To make your Actor [public](https://docs.apify.com/platform/actors/publishing),
    use the [Update Actor](/api/v2/actor-put) endpoint.

  operationId: actors_post
  requestBody:
    description: ""
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/actors/CreateActorRequest.yaml
        example:
          name: MyActor
          description: My favourite Actor!
          title: My Actor
          isPublic: false
          seoTitle: My Actor
          seoDescription: My Actor is the best
          versions:
            - versionNumber: "0.0"
              sourceType: SOURCE_FILES
              envVars:
                - name: DOMAIN
                  value: "http://example.com"
                  isSecret: false
                - name: SECRET_PASSWORD
                  value: MyTopSecretPassword123
                  isSecret: true
              applyEnvVarsToBuild: false
              buildTag: latest
              sourceFiles: []
          categories: []
          defaultRunOptions:
            build: latest
            timeoutSecs: 3600
            memoryMbytes: 2048
            restartOnError: false
    required: true
  responses:
    "201":
      description: ""
      headers:
        Location:
          content:
            text/plain:
              schema:
                type: string
              example: https://api.apify.com/v2/actors/zdc3Pyhyz3m8vjDeM
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/actors/ActorResponse.yaml
          example:
            data:
              id: zdc3Pyhyz3m8vjDeM
              userId: wRsJZtadYvn4mBZmm
              name: instagram-scraper
              username: jane35
              description: This scraper extracts posts and comments from Instagram.
              isPublic: false
              createdAt: "2019-07-08T11:27:57.401Z"
              modifiedAt: "2019-07-08T14:01:05.546Z"
              taggedBuilds: {}
              stats:
                totalBuilds: 9
                totalRuns: 16
                totalUsers: 6
                totalUsers7Days: 2
                totalUsers30Days: 6
                totalUsers90Days: 6
                totalMetamorphs: 2
              versions:
                - versionNumber: "0.0"
                  envVars: null
                  sourceType: SOURCE_FILES
                  applyEnvVarsToBuild: false
                  buildTag: latest
                  sourceFiles: []
              defaultRunOptions:
                build: latest
                timeoutSecs: 3600
                memoryMbytes: 2048
                restartOnError: false
              exampleRunInput:
                body: '{ "helloWorld": 123 }'
                contentType: application/json; charset=utf-8
              categories: []
              isDeprecated: false
              title: My Actor
              notice: "NONE"
              isCritical: false
              isGeneric: false
              hasNoDataset: false
              isSourceCodeHidden: true
              standbyUrl: null
              actorPermissionLevel: "LIMITED_PERMISSIONS"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "403":
      $ref: ../../components/responses/Forbidden.yaml
    "405":
      $ref: ../../components/responses/MethodNotAllowed.yaml
    "413":
      $ref: ../../components/responses/PayloadTooLarge.yaml
    "415":
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    "429":
      $ref: ../../components/responses/TooManyRequests.yaml
  deprecated: false
  x-legacy-doc-urls:
    - https://docs.apify.com/api/v2#/reference/actors/actor-collection/create-actor
    - https://docs.apify.com/api/v2#/reference/actors/create-actor
    - https://docs.apify.com/api/v2#tag/ActorsActor-collection/operation/acts_post
  x-js-parent: ActorCollectionClient
  x-js-name: create
  x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ActorCollectionClient#create
  x-py-parent: ActorCollectionClientAsync
  x-py-name: create
  x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ActorCollectionClientAsync#create
