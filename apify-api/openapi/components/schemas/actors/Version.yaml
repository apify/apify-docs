title: Version
type: object
required:
  - versionNumber
  - sourceType
properties:
  versionNumber:
    type: string
    pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$
    examples: ["0.0"]
    description: The version number of the Actor. Two numbers separated by a dot,
      that represent the `MAJOR.MINOR` part of the semantic versioning.
  sourceType:
    anyOf:
      - $ref: ./VersionSourceType.yaml
      - type: "null"
    description: Where the source code of the version lives.
  envVars:
    anyOf:
      - type: array
        items:
          $ref: ./EnvVar.yaml
      - type: "null"
    description: Environment variables for the version.
  applyEnvVarsToBuild:
    type: [boolean, "null"]
    examples: [false]
    description: Whether to inject the environment variables at build time.
  buildTag:
    type: [string, "null"]
    examples: [latest]
    description: The tag name to apply to a successful build of this version. Can be `null` when the version has no build tag.
  sourceFiles:
    $ref: ./VersionSourceFiles.yaml
    description: Applies when the `sourceType` is `SOURCE_FILES`. Represents the Actor's
      file structure as an array of files and folders.
  gitRepoUrl:
    type: [string, "null"]
    description: URL of the Git repository to clone the source code from. Applies when the `sourceType` is `GIT_REPO`.
  tarballUrl:
    type: [string, "null"]
    description: URL to download the source code from as a zip archive. Applies when the `sourceType` is `TARBALL`.
  gitHubGistUrl:
    type: [string, "null"]
    description: URL of the GitHub Gist to clone the source code from. Applies when the `sourceType` is `GITHUB_GIST`.
  actorPath:
    type: [string, "null"]
    examples: [actors/typescript-actor]
    description: The Actor's directory inside the uploaded source, as a path relative to the upload root with `/` separators,
      for example `actors/typescript-actor`. Applies when the `sourceType` is `SOURCE_FILES` or `TARBALL`. When omitted,
      the upload root is the Actor's directory. Never empty, with no leading or trailing `/` and no `.` or `..` segments.
