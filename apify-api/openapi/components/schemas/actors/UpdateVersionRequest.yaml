title: UpdateVersionRequest
type: object
properties:
  versionNumber:
    type: string
    pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$
    examples: ["1.6"]
    description: The version number of the Actor. Two numbers separated by a dot,
      that represent the `MAJOR.MINOR` part of the semantic versioning.
  sourceType:
    $ref: ./WritableVersionSourceType.yaml
    description: Where the source code of the version lives.
  envVars:
    type: array
    items:
      $ref: ./EnvVarRequest.yaml
    description: Environment variables for the version.
  applyEnvVarsToBuild:
    type: [boolean, "null"]
    examples: [false]
    description: Whether to inject the environment variables at build time.
  buildTag:
    type: [string, "null"]
    examples: [latest]
    description: The tag name to apply to a successful build of this version. Can be `null` when the version has no build tag.
  sourceFiles:
    $ref: ./VersionSourceFiles.yaml
    description: Required when the request sets `sourceType` to `SOURCE_FILES`. Represents the Actor's
      file structure as an array of files and folders.
  gitRepoUrl:
    type: string
    description: URL of the Git repository to clone the source code from. Required when the request sets `sourceType` to `GIT_REPO`.
  tarballUrl:
    type: string
    description: URL of the tarball to download the source code from. Required when the request sets `sourceType` to `TARBALL`.
  gitHubGistUrl:
    type: string
    description: URL of the GitHub Gist to clone the source code from. Required when the request sets `sourceType` to `GITHUB_GIST`.
allOf:
  - if:
      required:
        - sourceType
      properties:
        sourceType:
          const: SOURCE_FILES
    then:
      required:
        - sourceFiles
  - if:
      required:
        - sourceType
      properties:
        sourceType:
          const: GIT_REPO
    then:
      required:
        - gitRepoUrl
  - if:
      required:
        - sourceType
      properties:
        sourceType:
          const: TARBALL
    then:
      required:
        - tarballUrl
  - if:
      required:
        - sourceType
      properties:
        sourceType:
          const: GITHUB_GIST
    then:
      required:
        - gitHubGistUrl
