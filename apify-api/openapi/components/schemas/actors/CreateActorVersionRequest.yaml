title: CreateActorVersionRequest
description: A version created together with the Actor. `versionNumber` and `sourceType` are required and can't be `null`.
allOf:
  - $ref: ./CreateOrUpdateVersionRequest.yaml
  - type: object
    required:
      - versionNumber
      - sourceType
    properties:
      versionNumber:
        type: string
      sourceType:
        $ref: ./VersionSourceType.yaml
