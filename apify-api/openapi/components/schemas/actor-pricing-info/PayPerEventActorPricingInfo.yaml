title: PayPerEventActorPricingInfo
allOf:
  - $ref: ./CommonActorPricingInfo.yaml
  - type: object
    required:
      - pricingModel
      - pricingPerEvent
    properties:
      pricingModel:
        type: string
        const: PAY_PER_EVENT
      pricingPerEvent:
        type: object
        properties:
          actorChargeEvents:
            type: object
            additionalProperties:
              $ref: ./ActorChargeEvent.yaml
      minimalMaxTotalChargeUsd:
        type: [number, "null"]
      isPPEPlatformUsagePaidByUser:
        type: [boolean, "null"]
        examples: [false]
        description: If `true`, the platform usage of the run is charged to the user running the Actor, in addition to the event prices.
