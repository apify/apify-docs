title: CommonActorPricingInfo
type: object
required:
  - apifyMarginPercentage
  - createdAt
  - startedAt
properties:
  apifyMarginPercentage:
    type: number
    examples: [0.2]
    description: >
        Apify's share of the revenue generated under this pricing info record,
        as a fraction between 0 and 1. Set by the Apify platform.
  createdAt:
    type: string
    format: date-time
    description: When this pricing info record has been created
  startedAt:
    type: string
    format: date-time
    description: Since when is this pricing info record effective for a given Actor
  notifiedAboutFutureChangeAt:
    type: [string, "null"]
    format: date-time
    x-internal: true
  notifiedAboutChangeAt:
    type: [string, "null"]
    format: date-time
    x-internal: true
  reasonForChange:
    type: [string, "null"]
    x-internal: true
  isPriceChangeNotificationSuppressed:
    type: boolean
    x-internal: true
  forceContainsSignificantPriceChange:
    type: boolean
    x-internal: true
