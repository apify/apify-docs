title: WebhookListItem
required:
  - id
  - createdAt
  - modifiedAt
  - userId
  - eventTypes
  - condition
  - ignoreSslErrors
  - doNotRetry
type: object
properties:
  id:
    type: string
    examples: [YiKoxjkaS9gjGTqhF]
  createdAt:
    type: string
    format: date-time
    examples: ["2019-12-12T07:34:14.202Z"]
  modifiedAt:
    type: string
    format: date-time
    examples: ["2019-12-13T08:36:13.202Z"]
  userId:
    type: string
    examples: [wRsJZtadYvn4mBZmm]
  isAdHoc:
    type: [boolean, "null"]
    examples: [false]
  isApifyIntegration:
    type: boolean
    examples: [false]
  isEnabled:
    type: boolean
    examples: [true]
  actionType:
    type: string
    examples: [HTTP_REQUEST]
  shouldInterpolateStrings:
    type: [boolean, "null"]
    examples: [false]
  eventTypes:
    type: array
    items:
      $ref: ./WebhookEventType.yaml
    examples:
      - [ACTOR.RUN.SUCCEEDED]
  condition:
    $ref: ./WebhookCondition.yaml
  ignoreSslErrors:
    type: boolean
    examples: [false]
  doNotRetry:
    type: boolean
    examples: [false]
  requestUrl:
    type: [string, "null"]
    format: uri
    description: URL of the HTTP request sent by the webhook. It is omitted or `null` for hook actions other than the conventional HTTP case (e.g. Slack or email notifications).
    examples: ["http://example.com/"]
  headersTemplate:
    type: [string, "null"]
    examples: ['{\n "Authorization": "Bearer ..."}']
  title:
    type: [string, "null"]
    examples: [Notify on failure]
  description:
    type: [string, "null"]
    examples: [this is webhook description]
  slackMessage:
    $ref: ./WebhookSlackMessage.yaml
  googleMail:
    $ref: ./WebhookGoogleMail.yaml
  googleDrive:
    $ref: ./WebhookGoogleDrive.yaml
  githubIssue:
    $ref: ./WebhookGithubIssue.yaml
  lastDispatch:
    anyOf:
      - $ref: ./WebhookLastDispatch.yaml
      - type: "null"
  stats:
    anyOf:
      - $ref: ./WebhookStats.yaml
      - type: "null"
