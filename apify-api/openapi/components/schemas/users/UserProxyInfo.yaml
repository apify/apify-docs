title: UserProxyInfo
description: |
  User data returned when the request is authenticated with a proxy password,
  including the per-run proxy password of an Actor run (`APIFY_PROXY_PASSWORD`).
  Contains only the fields Apify Proxy reads.
required:
  - plan
  - effectivePlatformFeatures
  - isPaying
type: object
properties:
  plan:
    title: UserProxyPlan
    required:
      - availableProxyGroups
    type: object
    properties:
      availableProxyGroups:
        $ref: ./AvailableProxyGroups.yaml
  effectivePlatformFeatures:
    $ref: ./EffectivePlatformFeatures.yaml
  isPaying:
    type: boolean
    examples: [true]
