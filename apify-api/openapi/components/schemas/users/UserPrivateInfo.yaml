title: UserPrivateInfo
required:
  - username
type: object
properties:
  id:
    type: string
    examples: [YiKoxjkaS9gjGTqhF]
  username:
    type: string
    examples: [myusername]
  profile:
    $ref: ./UserProfile.yaml
  email:
    type: [string, "null"]
    format: email
    description: Primary email of the user. It is `null` when the email is not verified.
    examples: [bob@example.com]
  proxy:
    $ref: ./ProxyResource.yaml
  plan:
    $ref: ./UserPlan.yaml
  effectivePlatformFeatures:
    $ref: ./EffectivePlatformFeatures.yaml
  createdAt:
    type: string
    format: date-time
    examples: ["2022-11-29T14:48:29.381Z"]
  isPaying:
    type: boolean
    examples: [true]
  organizationOwnerUserId:
    type: [string, "null"]
    description: ID of the user who owns the organization. Present only for organization accounts.
    examples: [wRsJZtadYvn4mBZmm]
