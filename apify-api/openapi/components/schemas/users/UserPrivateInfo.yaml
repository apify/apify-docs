title: UserPrivateInfo
required:
  - username
type: object
properties:
  id:
    type: string
    examples: [YiKoxjkaS9gjGTqhF]
  username:
    type: string
    examples: [myusername]
  profile:
    $ref: ./UserProfile.yaml
  email:
    type: string
    format: email
    examples: [bob@example.com]
  proxy:
    $ref: ./UserProxy.yaml
  plan:
    $ref: ./UserPlan.yaml
  effectivePlatformFeatures:
    $ref: ./EffectivePlatformFeatures.yaml
  createdAt:
    type: string
    format: date-time
    examples: ["2022-11-29T14:48:29.381Z"]
  isPaying:
    type: boolean
    examples: [true]
