title: Profile
type: object
properties:
  bio:
    type: [string, "null"]
    examples: [I started web scraping in 1985 using Altair BASIC.]
  readme:
    type: [string, "null"]
    description: Markdown README shown on the user's public profile page.
    examples: ["### Hello world 👋🏻\nI build web scrapers."]
  name:
    type: string
    examples: [Jane Doe]
  pictureUrl:
    type: [string, "null"]
    format: uri
    examples: [https://apify.com/img/anonymous_user_picture.png]
  githubUsername:
    type: [string, "null"]
    examples: [torvalds.]
  websiteUrl:
    type: [string, "null"]
    format: uri
    examples: [http://www.example.com]
  twitterUsername:
    type: [string, "null"]
    examples: ["@BillGates"]
