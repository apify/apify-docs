title: UpdateLimitsRequest
type: object
properties:
  maxMonthlyUsageUsd:
    type: number
    examples: [300]
    description: |
      If your platform usage in the billing period exceeds the prepaid usage, you will be charged extra. Setting this property you can update your hard limit on monthly platform usage to prevent accidental overage or to limit the extra charges.
  dataRetentionDays:
    type: integer
    examples: [90]
    description: |
      Unnamed storages and Actor runs are automatically deleted after the retention period. If you're subscribed, you can change it to keep data for longer or to limit your usage. [Learn more](https://docs.apify.com/storage#data-retention).
