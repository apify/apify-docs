title: StoreActor
required:
  - id
  - title
  - name
  - username
  - stats
type: object
properties:
  id:
    type: string
    examples: [zdc3Pyhyz3m8vjDeM]
  title:
    type: string
    examples: [My Public Actor]
  name:
    type: string
    examples: [my-public-actor]
  username:
    type: string
    examples: [jane35]
  userFullName:
    type: [string, "null"]
    examples: [Jane H. Doe]
  description:
    type: [string, "null"]
    examples: [My public actor!]
  categories:
    type: array
    items:
      type: string
    example:
      - MARKETING
      - LEAD_GENERATION
  notice:
    $ref: ../actors/ActorNotice.yaml
  pictureUrl:
    type: [string, "null"]
    examples: ["https://..."]
  userPictureUrl:
    type: [string, "null"]
    format: uri
    examples: ["https://..."]
  url:
    type: [string, "null"]
    format: uri
    examples: ["https://..."]
  stats:
    description: Actor statistics. Review count and rating are returned here, not at the top level. `bookmarkCount` and `publicActorRunStats30Days` are not returned by the Store endpoint.
    $ref: ../actors/ActorStats.yaml
  currentPricingInfo:
    $ref: ./CurrentPricingInfo.yaml
  isWhiteListedForAgenticPayments:
    type: [boolean, "null"]
    description: Whether the Actor is whitelisted for agentic payment processing.
  isVerified:
    type: boolean
    description: Whether the Actor's developer has a verified identity.
    examples: [false]
  badge:
    type: [string, "null"]
    examples: [null]
  readmeSummary:
    type: string
    description: A brief, LLM-generated readme summary
  inputSchema:
    type: object
    description: Compact input schema of the Actor's default build, with only property types and required properties. Returned only when `includeInputSchema=true` and the default build succeeded and defines input properties.
    required:
      - type
      - properties
    properties:
      type:
        type: string
        examples: [object]
      properties:
        type: object
        additionalProperties:
          type: object
          properties:
            type:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
        examples:
          - startUrls:
              type: array
            maxItems:
              type: integer
      required:
        type: array
        items:
          type: string
        examples: [[startUrls]]
