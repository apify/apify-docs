title: CurrentPricingInfo
required:
  - pricingModel
type: object
properties:
  pricingModel:
    type: string
    examples: [FREE]
  apifyMarginPercentage:
    type: number
    examples: [0.2]
    description: >
        Apify's share of the revenue generated under this pricing info record,
        as a fraction between 0 and 1. Set by the Apify platform.
  createdAt:
    type: string
    format: date-time
    examples: ["2023-01-01T00:00:00.000Z"]
  startedAt:
    type: string
    format: date-time
    examples: ["2023-01-01T00:00:00.000Z"]
  notifiedAboutChangeAt:
    type: [string, "null"]
    format: date-time
    examples: [null]
  notifiedAboutFutureChangeAt:
    type: [string, "null"]
    format: date-time
    examples: [null]
  isPriceChangeNotificationSuppressed:
    type: boolean
    examples: [false]
  forceContainsSignificantPriceChange:
    type: boolean
    examples: [false]
  isPPEPlatformUsagePaidByUser:
    type: boolean
    examples: [false]
  reasonForChange:
    type: [string, "null"]
    examples: [null]
  minimalMaxTotalChargeUsd:
    type: [number, "null"]
    examples: [0.5]
  pricingPerEvent:
    type: [object, "null"]
    description: Per-event pricing configuration for pay-per-event Actors.
    additionalProperties: true
  pricePerUnitUsd:
    type: number
    description: Price per unit in USD. Present only for `FLAT_PRICE_PER_MONTH` and non-tiered `PRICE_PER_DATASET_ITEM` pricing.
    examples: [5]
  trialMinutes:
    type: integer
    description: Length of the free trial in minutes. Present only for `FLAT_PRICE_PER_MONTH` pricing.
    examples: [1440]
  unitName:
    type: string
    description: Name of the charged unit. Present only for `PRICE_PER_DATASET_ITEM` pricing.
    examples: [result]
  tieredPricing:
    type: object
    description: Price per unit for each pricing tier. Present only for tiered `PRICE_PER_DATASET_ITEM` pricing.
    additionalProperties:
      type: object
      properties:
        tieredPricePerUnitUsd:
          type: number
    examples:
      - FREE:
          tieredPricePerUnitUsd: 0.005
  notifiedAboutRentalToPpePriceChangeAt:
    type: [string, "null"]
    format: date-time
    examples: [null]
    x-internal: true
