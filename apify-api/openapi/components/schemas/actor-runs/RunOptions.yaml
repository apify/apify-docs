title: RunOptions
required:
  - build
  - timeoutSecs
  - memoryMbytes
  - diskMbytes
type: object
properties:
  build:
    type: string
    examples: [latest]
  timeoutSecs:
    type: integer
    minimum: 0
    examples: [300]
  memoryMbytes:
    type: integer
    minimum: 128
    maximum: 32768
    examples: [1024]
  diskMbytes:
    type: integer
    minimum: 0
    examples: [2048]
  restartOnError:
    type: [boolean, "null"]
    examples: [false]
    description: Whether to automatically restart the run if it fails.
  maxItems:
    type: [integer, "null"]
    minimum: 0
    examples: [1000]
  maxTotalChargeUsd:
    type: [number, "null"]
    minimum: 0
    examples: [5]
  isMaxTotalChargeUsdSetByUser:
    type: boolean
    examples: [true]
    description: Whether the user explicitly set `maxTotalChargeUsd` when starting the run. Not present for pay-per-result Actors.
