title: ChargeRunRequest
required:
  - eventName
  - count
type: object
properties:
  eventName:
    type: string
    examples: [ANALYZE_PAGE]
  count:
    type: integer
    examples: [1]
  requestId:
    type: string
    description: |
      When charging for a request to a multi-tenant Server Actor, set this field to the `X-Actor-Request-ID` header value received by your Actor.
      Single-tenant Server Actors charge events like ordinary runs and don't need this field.
