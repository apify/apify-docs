title: ChargeRunRequest
required:
  - eventName
  - count
type: object
properties:
  eventName:
    type: string
    examples: [ANALYZE_PAGE]
  count:
    type: integer
    examples: [1]
  requestId:
    type: string
    description: ID of the Standby request being charged, from the `X-Apify-Request-ID` header of the incoming request. Required for multi-tenant Standby runs, where it maps the charge to the caller's account instead of the account that started the run.
    examples: [7Hs2kQw9LxP4mN1vB]
