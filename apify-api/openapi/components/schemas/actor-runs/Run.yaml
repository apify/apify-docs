title: Run
description: Represents an Actor run and its associated data.
required:
  - id
  - actId
  - userId
  - startedAt
  - status
  - meta
  - stats
  - options
  - buildId
  - defaultKeyValueStoreId
  - defaultDatasetId
  - defaultRequestQueueId
type: object
properties:
  id:
    type: string
    examples: [HG7ML7M8z78YcAPEB]
    description: Unique identifier of the Actor run.
  actId:
    type: string
    examples: [HDSasDasz78YcAPEB]
    description: ID of the Actor that was run.
  userId:
    type: string
    examples: [7sT5jcggjjA9fNcxF]
    description: ID of the user who started the run.
  actorTaskId:
    type: [string, "null"]
    examples: [KJHSKHausidyaJKHs]
    description: ID of the Actor task, if the run was started from a task.
  startedAt:
    type: string
    format: date-time
    examples: ["2019-11-30T07:34:24.202Z"]
    description: Time when the Actor run started.
  finishedAt:
    type: [string, "null"]
    format: date-time
    examples: ["2019-12-12T09:30:12.202Z"]
    description: Time when the Actor run finished.
  status:
    description: Current status of the Actor run.
    $ref: ../common/ActorJobStatus.yaml
  statusMessage:
    type: [string, "null"]
    examples: [Actor is running]
    description: Detailed message about the run status.
  isStatusMessageTerminal:
    type: [boolean, "null"]
    examples: [false]
    description: Whether the status message is terminal (final).
  meta:
    description: Metadata about the Actor run.
    $ref: ./RunMeta.yaml
  pricingInfo:
    description: Pricing information for the Actor.
    $ref: ../actor-pricing-info/ActorRunPricingInfo.yaml
  stats:
    description: Statistics of the Actor run.
    $ref: ./RunStats.yaml
  chargedEventCounts:
    description: A map of charged event types to their counts. The keys are event type identifiers defined by the Actor's pricing model (pay-per-event), and the values are the number of times each event was charged during this run.
    type: object
    additionalProperties:
      type: integer
    example:
      actor-start: 1
      page-crawled: 150
      data-extracted: 75
  accountedChargedEventCounts:
    description: A map of charged event types to the number of their charges that have already been accounted for billing. Present only for pay-per-event Actors.
    type: [object, "null"]
    additionalProperties:
      type: integer
    example:
      actor-start: 1
      page-crawled: 150
  eventUsage:
    description: >-
      Cost breakdown of the pay-per-event charges in USD, keyed by event type.
      Present only for pay-per-event runs, and not when the run was started by the Actor's owner.
    type: object
    additionalProperties:
      $ref: ./RunEventUsage.yaml
  externalChargedTotalUsd:
    type: number
    examples: [0.5]
    description: Total price in USD of the pay-per-event charges made to other users. Present only on multi-tenant Standby runs.
  standby:
    $ref: ./RunStandby.yaml
  integrationTracking:
    description: Present only when the run was started by a third-party integration.
    $ref: ../common/IntegrationTracking.yaml
  createdByOrganizationMemberUserId:
    type: string
    examples: [7sT5jcggjjA9fNcxF]
    description: ID of the organization member who started the run. Present only for runs started on behalf of an organization.
  consoleUrl:
    type: string
    format: uri
    examples: ["https://console.apify.com/view/runs/HG7ML7M8z78YcAPEB"]
    description: URL of the run in Apify Console. Returned only by the [Get Actor run](/api/v2/actor-run-get) endpoint.
  output:
    type: object
    description: >-
      Output links of the run, generated from the output schema of the Actor build.
      Present only if the build defines an output schema.
    additionalProperties:
      type: string
      format: uri
    example:
      results: "https://api.apify.com/v2/datasets/wmKPijuyDnPZAPRMk/items"
  options:
    description: Configuration options for the Actor run.
    $ref: ./RunOptions.yaml
  buildId:
    type: string
    examples: [7sT5jcggjjA9fNcxF]
    description: ID of the Actor build used for this run.
  exitCode:
    type: [integer, "null"]
    examples: [0]
    description: Exit code of the Actor run process.
  generalAccess:
    description: General access level for the Actor run.
    anyOf:
      - $ref: ../common/GeneralAccess.yaml
      - type: "null"
  defaultKeyValueStoreId:
    type: string
    examples: [eJNzqsbPiopwJcgGQ]
    description: ID of the default key-value store for this run.
  defaultDatasetId:
    type: string
    examples: [wmKPijuyDnPZAPRMk]
    description: ID of the default dataset for this run.
  defaultRequestQueueId:
    type: string
    examples: [FL35cSF7jrxr3BY39]
    description: ID of the default request queue for this run.
  storageIds:
    type: object
    description: A map of aliased storage IDs associated with this run, grouped by storage type.
    properties:
      datasets:
        type: object
        description: Aliased dataset IDs for this run.
        properties:
          default:
            type: string
            description: ID of the default dataset for this run.
            example: wmKPijuyDnPZAPRMk
        additionalProperties:
          type: string
      keyValueStores:
        type: object
        description: Aliased key-value store IDs for this run.
        properties:
          default:
            type: string
            description: ID of the default key-value store for this run.
            example: eJNzqsbPiopwJcgGQ
        additionalProperties:
          type: string
      requestQueues:
        type: object
        description: Aliased request queue IDs for this run.
        properties:
          default:
            type: string
            description: ID of the default request queue for this run.
            example: FL35cSF7jrxr3BY39
        additionalProperties:
          type: string
  buildNumber:
    type: [string, "null"]
    pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])(\.[1-9][0-9]{0,4})$
    examples: [0.0.36]
    description: Build number of the Actor build used for this run.
  containerUrl:
    type: string
    format: uri
    examples: ["https://g8kd8kbc5ge8.runs.apify.net"]
    description: URL of the container running the Actor.
  isContainerServerReady:
    type: [boolean, "null"]
    examples: [true]
    description: Whether the container's HTTP server is ready to accept requests.
  gitBranchName:
    type: [string, "null"]
    examples: [master]
    description: Name of the git branch used for the Actor build.
  usage:
    description: Resource usage statistics for the run.
    anyOf:
      - $ref: ./RunUsage.yaml
      - type: "null"
  usageTotalUsd:
    type: [number, "null"]
    examples: [0.2654]
    description: >-
      Total cost in USD for this run. Represents what you actually pay.
      For run owners: includes platform usage (compute units) and/or event costs depending on the Actor's pricing model.
      For run non-owners: only available for pay-per-event Actors (event costs only).
      Requires authentication token to access.
  usageUsd:
    description: >-
      Platform usage costs breakdown in USD. Only present if you own the run and are paying for platform usage
      (pay-per-usage or pay-per-event with usage costs like Standby Actors).
      Not available for standard pay-per-event Actors.
      Requires authentication token to access.
    anyOf:
      - $ref: ./RunUsageUsd.yaml
      - type: "null"
  metamorphs:
    description: List of metamorph events that occurred during the run.
    anyOf:
      - type: array
        items:
          $ref: ./RunMetamorphEvent.yaml
      - type: "null"
  platformUsageBillingModel:
    type: string
    description: Indicates which party covers platform usage costs for this run.
    examples: [USER]
