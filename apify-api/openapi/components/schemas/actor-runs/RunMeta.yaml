title: RunMeta
required:
  - origin
type: object
properties:
  origin:
    $ref: ./RunOrigin.yaml
  clientIp:
    type: [string, "null"]
    description: IP address of the client that started the run.
  userAgent:
    type: [string, "null"]
    description: User agent of the client that started the run.
  scheduleId:
    type: [string, "null"]
    description: ID of the schedule that triggered the run.
  scheduledAt:
    type: [string, "null"]
    format: date-time
    description: Time when the run was scheduled.
  actorRunId:
    type: string
    examples: [HG7ML7M8z78YcAPEB]
    description: ID of the Actor run that started this run. Present only when the run was started from another run.
  webhookDispatchId:
    type: string
    examples: [asdLZtadYvn4mBZmm]
    description: ID of the webhook dispatch that started the run. Present only when the run was started by a webhook.
  scheduledAct2Id:
    type: string
    examples: [c6KfSgoQzFhMk3etc]
    description: ID of the schedule action that started the Actor. Present only on runs of Actors started by a schedule.
  scheduledActorTaskId:
    type: string
    examples: [c6KfSgoQzFhMk3etc]
    description: ID of the schedule action that started the Actor task. Present only on runs of tasks started by a schedule.
