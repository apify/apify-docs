title: WebhookDispatchWebhookSummary
description: A summary of the webhook that triggered this dispatch.
type: object
properties:
  _id:
    type: string
    description: ID of the webhook. The API returns it under `_id`, not `id`.
    examples: [YiKoxjkaS9gjGTqhF]
  actionType:
    type: string
    examples: [HTTP_REQUEST]
  condition:
    $ref: ../webhooks/WebhookCondition.yaml
  requestUrl:
    type: [string, "null"]
    format: uri
    description: URL of the HTTP request sent by the webhook. It is `null` for hook actions other than the conventional HTTP case (e.g. Slack or email notifications).
    examples: ["https://example.com/webhook"]
  isAdHoc:
    type: boolean
    examples: [false]
  isApifyIntegration:
    type: [boolean, "null"]
    examples: [false]
  slackMessage:
    $ref: ../webhooks/WebhookSlackMessage.yaml
  googleMail:
    $ref: ../webhooks/WebhookGoogleMail.yaml
  googleDrive:
    $ref: ../webhooks/WebhookGoogleDrive.yaml
  githubIssue:
    $ref: ../webhooks/WebhookGithubIssue.yaml
