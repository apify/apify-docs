ScheduleListItem:
  title: ScheduleListItem
  allOf:
    - $ref: ./ScheduleBase.yaml
    - type: object
      required:
        - actions
      properties:
        title:
          type: [string, "null"]
        notifications:
          $ref: ./ScheduleNotifications.yaml
        integrationTracking:
          description: Present only when the schedule was created by a third-party integration.
          $ref: ../common/IntegrationTracking.yaml
        actions:
          type: array
          items:
            $ref: ./ScheduleListItemAction.yaml
          description: ""

Schedule:
  title: Schedule
  allOf:
    - $ref: ./ScheduleBase.yaml
    - type: object
      required:
        - actions
      properties:
        description:
          type: [string, "null"]
          examples: [Schedule of actor ...]
        title:
          type: [string, "null"]
        notifications:
          $ref: ./ScheduleNotifications.yaml
        uiState:
          $ref: ./ScheduleUiState.yaml
        integrationTracking:
          description: Present only when the schedule was created by a third-party integration.
          $ref: ../common/IntegrationTracking.yaml
        actions:
          type: array
          items:
            $ref: ./ScheduleAction.yaml
          description: ""
