title: CreateTaskRequest
required:
  - actId
type: object
properties:
  actId:
    type: string
    examples: [asADASadYvn4mBZmm]
  name:
    type: string
    examples: [my-task]
  options:
    anyOf:
      - $ref: ../common/TaskOptions.yaml
      - type: "null"
  input:
    anyOf:
      - $ref: ./TaskInput.yaml
      - type: "null"
  title:
    type: [string, "null"]
  actorStandby:
    anyOf:
      - $ref: ../actors/ActorStandby.yaml
      - type: "null"
  publicConfig:
    description: |
      Public-facing display configuration of the task's public landing page. The task is not
      published by setting it — use the [Publish task](/api/v2/actor-task-publish-post)
      endpoint for that. Setting `publicConfig` requires write permission to the task's Actor.
    $ref: ./TaskPublicConfig.yaml
