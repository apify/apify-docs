title: Task
required:
  - id
  - userId
  - actId
  - name
  - createdAt
  - modifiedAt
type: object
properties:
  id:
    type: string
    examples: [zdc3Pyhyz3m8vjDeM]
  userId:
    type: string
    examples: [wRsJZtadYvn4mBZmm]
  actId:
    type: string
    examples: [asADASadYvn4mBZmm]
  name:
    type: string
    examples: [my-task]
  username:
    type: [string, "null"]
    examples: [janedoe]
  createdAt:
    type: string
    format: date-time
    examples: ["2018-10-26T07:23:14.855Z"]
  modifiedAt:
    type: string
    format: date-time
    examples: ["2018-10-26T13:30:49.578Z"]
  removedAt:
    type: [string, "null"]
    format: date-time
  stats:
    anyOf:
      - $ref: ./TaskStats.yaml
      - type: "null"
  options:
    anyOf:
      - $ref: ../common/TaskOptions.yaml
      - type: "null"
  input:
    anyOf:
      - $ref: ./TaskInput.yaml
      - type: "null"
  title:
    type: [string, "null"]
  actorStandby:
    anyOf:
      - $ref: ../actors/ActorStandby.yaml
      - type: "null"
  standbyUrl:
    type: [string, "null"]
    format: uri
  isPublic:
    type: boolean
    description: |
      Whether the task is published. Derived from `publicConfig.publishedAt`. Set it via the
      [Update task](/api/v2/actor-task-put) endpoint to publish or unpublish the task.

      Publishing lists the task among the Actor's examples and makes its input public, so anyone
      can view and copy it. The task's own landing page is shown only while `publicConfig` still
      validates against the Actor's current build - a new build can therefore stop the page from
      being offered while the task stays published and copyable.
    examples: [false]
  publicConfig:
    anyOf:
      - $ref: ./TaskPublicConfig.yaml
      - type: "null"
