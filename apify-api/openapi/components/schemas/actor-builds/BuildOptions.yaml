title: BuildOptions
type: object
properties:
  useCache:
    type: [boolean, "null"]
    examples: [false]
  betaPackages:
    type: [boolean, "null"]
    examples: [false]
  memoryMbytes:
    type: [integer, "null"]
    examples: [1024]
  diskMbytes:
    type: [integer, "null"]
    examples: [2048]
  tag:
    type: [string, "null"]
    examples: [latest]
    description: The tag passed when starting the build. Present only when the `tag` parameter was used.
  debug:
    type: [boolean, "null"]
    description: Whether this is a debug build. Present only on debug builds.
