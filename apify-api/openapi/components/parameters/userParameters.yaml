userId:
  name: userId
  in: path
  description: |
    User ID or username of the account to return the data for. Use `me` for the
    account the API token belongs to. Apart from `me`, only the token's own
    account and an organization the token's account is a member of are
    accessible. API tokens with limited permissions cannot access this data.
  required: true
  style: simple
  schema:
    type: string
    example: me
